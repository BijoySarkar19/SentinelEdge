[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentineledge-backend"
version = "0.1.0"
description = "SentinelEdge backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "redis>=5.2.1",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "sentence-transformers>=3.3.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.19",
    "slowapi>=0.1.9",
    "prometheus-client>=0.21.1",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "anyio>=4.7.0",
    "websockets>=14.1",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
