# =============================================================================
# SentinelEdge — Complete Multi-Service Docker Compose
# Architecture:
# - postgres: PostgreSQL 16 with pgvector extension
# - redis: Redis 7.4 Streams event broker
# - backend: FastAPI v1 REST API, WebSockets, pgvector embeddings
# - edge: In-memory Computer Vision runtime (YOLOv8n + ByteTrack + Privacy)
# - frontend: Next.js 15 App Router web console
# - prometheus: Application metrics collection
# - grafana: Real-time telemetry visualization dashboards
# =============================================================================

name: sentineledge

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentineledge}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentineledge}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Redis 7.4 Streams Event Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # FastAPI Backend (REST API + pgvector + WebSockets)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinelpass}@postgres:5432/${POSTGRES_DB:-sentineledge}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      API_BASE_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level info
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Edge Computer Vision & Privacy Processor (Containerized)
  # ---------------------------------------------------------------------------
  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: sentinel_edge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000
      INGEST_ENDPOINT: /api/v1/incidents/ingest
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
      CAMERA_ID: CAM-DOCKER-01
      SOURCE_URI: ${SOURCE_URI:-0}
      PRIVACY_MODE: metadata_only
    depends_on:
      - backend
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Next.js Frontend (Operations Console)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Prometheus Metrics Scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sentinel_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Grafana Telemetry Dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: sentinel_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - sentinel_net

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  sentinel_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
