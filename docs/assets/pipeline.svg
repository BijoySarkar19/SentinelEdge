<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192D" />
      <stop offset="100%" stop-color="#091426" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes activeDot {
        0% { transform: translateX(0); opacity: 0; }
        30% { opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }
      .flowing-wire {
        stroke-dasharray: 6 6;
        animation: dashFlow 1.2s linear infinite;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#050B16" stroke="rgba(255,255,255,0.06)" />

  <!-- STAGE 1: RTSP / Video Frame Capture -->
  <g transform="translate(40, 40)">
    <rect width="180" height="150" rx="10" fill="url(#edgeGrad)" stroke="#22D3EE" stroke-width="1.5" />
    <circle cx="90" cy="45" r="22" fill="rgba(34,211,238,0.1)" stroke="#22D3EE" stroke-width="1.5" />
    <path d="M 83 40 L 83 50 L 98 45 Z" fill="#22D3EE" />
    <text x="90" y="92" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">1. Edge Capture</text>
    <text x="90" y="112" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">RTSP • Webcam • File</text>
    <text x="90" y="128" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10">Frame-Skip Rate: 2</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 220 115 L 280 115" stroke="#22D3EE" stroke-width="2" class="flowing-wire" />
  <polygon points="280,115 272,110 272,120" fill="#22D3EE" />

  <!-- STAGE 2: Detection & ByteTrack -->
  <g transform="translate(280, 40)">
    <rect width="180" height="150" rx="10" fill="url(#edgeGrad)" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="90" cy="45" r="22" fill="rgba(59,130,246,0.1)" stroke="#3B82F6" stroke-width="1.5" />
    <text x="90" y="50" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="13" font-weight="bold">YOLO</text>
    <text x="90" y="92" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">2. Vision & Track</text>
    <text x="90" y="112" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">YOLOv8n + ByteTrack</text>
    <text x="90" y="128" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="10">RTX 3050 (41ms)</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 460 115 L 520 115" stroke="#3B82F6" stroke-width="2" class="flowing-wire" />
  <polygon points="520,115 512,110 512,120" fill="#3B82F6" />

  <!-- STAGE 3: Privacy & Rules Engine -->
  <g transform="translate(520, 40)">
    <rect width="180" height="150" rx="10" fill="url(#edgeGrad)" stroke="#10B981" stroke-width="1.5" />
    <circle cx="90" cy="45" r="22" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1.5" />
    <path d="M 90 32 L 102 38 V 48 C 102 56 90 62 90 62 C 90 62 78 56 78 48 V 38 Z" fill="none" stroke="#10B981" stroke-width="2" />
    <text x="90" y="92" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">3. Privacy & Rules</text>
    <text x="90" y="112" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Faces Blurred Locally</text>
    <text x="90" y="128" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10">Zero Raw Video</text>
  </g>

  <!-- Flow 3 -> 4 (Encrypted Metadata Only) -->
  <path d="M 700 115 L 760 115" stroke="#10B981" stroke-width="2" class="flowing-wire" />
  <polygon points="760,115 752,110 752,120" fill="#10B981" />

  <!-- STAGE 4: Central Cloud & Dashboard -->
  <g transform="translate(760, 40)">
    <rect width="200" height="150" rx="10" fill="url(#edgeGrad)" stroke="#F97316" stroke-width="1.5" />
    <circle cx="100" cy="45" r="22" fill="rgba(249,115,22,0.1)" stroke="#F97316" stroke-width="1.5" />
    <path d="M 90 45 L 97 52 L 110 38" fill="none" stroke="#F97316" stroke-width="2" />
    <text x="100" y="92" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">4. Ops Console</text>
    <text x="100" y="112" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Redis • pgvector • Next.js</text>
    <text x="100" y="128" text-anchor="middle" fill="#F97316" font-family="monospace" font-size="10">Live WebSockets</text>
  </g>
</svg>
