<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E223D" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="1000" height="240" rx="12" fill="#050B16" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.15" />

  <!-- STAGE 1: Video Ingestion Source -->
  <g transform="translate(35, 45)">
    <rect width="195" height="150" rx="10" fill="url(#edgeGrad)" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="97" cy="45" r="22" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-width="1.5" />
    <!-- Video camera icon -->
    <path d="M 88 38 L 88 52 L 104 45 Z" fill="#22D3EE" />
    <text x="97" y="94" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">1. Edge Capture</text>
    <text x="97" y="114" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">RTSP • Webcam • File</text>
    <text x="97" y="132" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10" font-weight="600">Adaptive Frame-Skip</text>
  </g>

  <!-- Flow 1 -> 2 Connector Line & Arrow -->
  <line x1="230" y1="120" x2="275" y2="120" stroke="#22D3EE" stroke-width="2" stroke-dasharray="5 4" />
  <polygon points="275,120 267,115 267,125" fill="#22D3EE" />

  <!-- STAGE 2: Detection & ByteTrack -->
  <g transform="translate(275, 45)">
    <rect width="195" height="150" rx="10" fill="url(#edgeGrad)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="97" cy="45" r="22" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="1.5" />
    <text x="97" y="50" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="900">YOLO</text>
    <text x="97" y="94" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. Vision &amp; Track</text>
    <text x="97" y="114" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">YOLOv8n + ByteTrack</text>
    <text x="97" y="132" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600">RTX 3050 (~18ms)</text>
  </g>

  <!-- Flow 2 -> 3 Connector Line & Arrow -->
  <line x1="470" y1="120" x2="515" y2="120" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 4" />
  <polygon points="515,120 507,115 507,125" fill="#3B82F6" />

  <!-- STAGE 3: Privacy Anonymization & Rules Engine -->
  <g transform="translate(515, 45)">
    <rect width="195" height="150" rx="10" fill="url(#edgeGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="97" cy="45" r="22" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5" />
    <!-- Shield icon -->
    <path d="M 97 33 L 109 39 V 49 C 109 57 97 63 97 63 C 97 63 85 57 85 49 V 39 Z" fill="none" stroke="#10B981" stroke-width="2" />
    <text x="97" y="94" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3. Privacy &amp; Rules</text>
    <text x="97" y="114" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">In-Memory Face Blurring</text>
    <text x="97" y="132" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10" font-weight="600">ZERO Raw Video Sent</text>
  </g>

  <!-- Flow 3 -> 4 Connector Line & Arrow (Encrypted Metadata Only) -->
  <line x1="710" y1="120" x2="755" y2="120" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" />
  <polygon points="755,120 747,115 747,125" fill="#10B981" />

  <!-- STAGE 4: Central Cloud & Enterprise Dashboard -->
  <g transform="translate(755, 45)">
    <rect width="210" height="150" rx="10" fill="url(#edgeGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="105" cy="45" r="22" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Checkmark monitor icon -->
    <path d="M 97 45 L 102 51 L 114 39" fill="none" stroke="#F59E0B" stroke-width="2" />
    <text x="105" y="94" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">4. Ops Console</text>
    <text x="105" y="114" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Redis • pgvector • Next.js</text>
    <text x="105" y="132" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="600">Live WebSocket Feeds</text>
  </g>
</svg>
