# =============================================================================
# SentinelEdge — Redis Configuration
# Tuned for a development / single-node production deployment.
# =============================================================================

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
daemonize no
loglevel notice
logfile ""
databases 16

# ---------------------------------------------------------------------------
# Persistence — RDB snapshots
# ---------------------------------------------------------------------------
# Save a snapshot if at least N keys changed in the last M seconds
save 3600 1
save 300 100
save 60 10000

# Stop accepting writes on RDB failure
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---------------------------------------------------------------------------
# Persistence — AOF (Append-Only File)
# ---------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
# fsync policy: always | everysec | no
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ---------------------------------------------------------------------------
# Memory management
# ---------------------------------------------------------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush no

# ---------------------------------------------------------------------------
# Slow log
# ---------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------------------------------------------------------------------------
# Latency monitoring
# ---------------------------------------------------------------------------
latency-monitor-threshold 100

# ---------------------------------------------------------------------------
# Active defragmentation (requires Redis 4+)
# ---------------------------------------------------------------------------
activedefrag no

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# requirepass <REDIS_PASSWORD>   # Uncomment and set via env injection in prod

# ---------------------------------------------------------------------------
# Cluster (disabled — single-node)
# ---------------------------------------------------------------------------
cluster-enabled no
