# =============================================================================
# SentinelEdge — Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s          # How frequently to scrape targets
  evaluation_interval: 15s      # How frequently to evaluate rules
  scrape_timeout: 10s
  external_labels:
    environment: sentineledge
    cluster: local

# ---------------------------------------------------------------------------
# Alerting (optional — wire up Alertmanager when needed)
# ---------------------------------------------------------------------------
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ---------------------------------------------------------------------------
# Rule files (create these when you add alerting rules)
# ---------------------------------------------------------------------------
rule_files:
  # - /etc/prometheus/rules/*.yml

# ---------------------------------------------------------------------------
# Scrape configurations
# ---------------------------------------------------------------------------
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics

  # SentinelEdge FastAPI backend
  - job_name: sentinel_backend
    static_configs:
      - targets:
          - backend:8000
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # PostgreSQL exporter (enable when postgres_exporter is added)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #   metrics_path: /metrics

  # Redis exporter (enable when redis_exporter is added)
  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #   metrics_path: /metrics

  # Redpanda (available via admin API when streaming stack is active)
  # - job_name: redpanda
  #   static_configs:
  #     - targets: ['redpanda:9644']
  #   metrics_path: /metrics
